<div class="inputWrapper" [style.--value]="resultPercent">
  <label htmlFor="{id}"> {{ label }}</label>
  @if (type === 'text') {
    <input id={id} [type]='type' [value]='value' (input)="onInputChange($event)"/>
  }
  @if (type === 'range') {
    <input id="{id}" type="{{type}}" [min]="min" [max]="max" (input)="onInputChange($event)" value="{{value}}" />
  }

</div>
